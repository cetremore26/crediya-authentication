##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: Autentication
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crediya_auth}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:crediya}
    password: ${DB_PASSWORD:crediya_auth_pass}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
  sql:
    init:
      mode: always
  devtools:
    add-properties: false
  profiles:
    include:
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
crediya:
  admin:
    email: ${ADMIN_EMAIL:admin@crediya.com}
    password: ${ADMIN_PASSWORD:Admin12345}
