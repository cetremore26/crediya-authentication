##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: crediya-authentication
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crediya_auth}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    username: ${DB_USERNAME:crediya}
    # Sin valor por defecto: el servicio no arranca si falta (ver perfil local).
    password: ${DB_PASSWORD}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    open-in-view: false
    hibernate:
      # Hibernate solo valida que las entidades coincidan con el esquema de Flyway.
      ddl-auto: ${DB_DDL_AUTO:validate}
  flyway:
    locations: classpath:db/migration
    # Bases creadas antes de Flyway (con schema.sql) se registran en la versión 1.
    baseline-on-migrate: true
    baseline-version: 1
  devtools:
    add-properties: false
jwt:
  # Clave RSA privada (PEM PKCS#8) con la que se firman los tokens RS256. Obligatoria:
  # generar con `openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048`.
  private-key: ${JWT_PRIVATE_KEY:}
  generate-ephemeral-key: false
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
crediya:
  admin:
    email: ${ADMIN_EMAIL:admin@crediya.com}
    # Clave del administrador inicial. Obligatoria (ver perfil local).
    password: ${ADMIN_PASSWORD}
management:
  # Solo se publica el estado de salud (lo usan Docker y docker-compose).
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
