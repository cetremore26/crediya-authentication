##Spring Configuration
server:
  port: 8080
spring:
  application:
    name: Autentication
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/crediya-auth;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
  sql:
    init:
      mode: always
  devtools:
    add-properties: false
  profiles:
    include:
jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
crediya:
  admin:
    email: ${ADMIN_EMAIL:admin@crediya.com}
    password: ${ADMIN_PASSWORD:Admin12345}
